defaults:
  - _self_
  - task: pusht_lowdim

name: train_ivon_diffusion_unet_ddim_lowdim
_target_: diffusion_policy.workspace.train_ivon_diffusion_unet_lowdim_workspace.TrainIvonDiffusionUnetLowdimWorkspace

obs_dim: ${task.obs_dim}
action_dim: ${task.action_dim}
keypoint_dim: ${task.keypoint_dim}
task_name: ${task.name}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True
pred_action_steps_only: False
# Manual MC-sample loop count around IVON's sampled_params() - see
# train_ivon_diffusion_unet_lowdim_workspace.py's training loop. 1 is
# IVON's own documented default ("a single sample can already give
# reasonable results" - Shen et al. 2024); raise it to reduce gradient
# variance at extra per-step cost.
num_mc_samples: 1

policy:
  _target_: diffusion_policy.policy.ivon_diffusion_unet_lowdim_policy.IvonDiffusionUnetLowdimPolicy

  model:
    # Plain, deterministic U-Net - no ProbConv1d/rho anywhere. IVON is the
    # thing that turns this into a Bayesian (mean-field Gaussian posterior)
    # network, entirely at the optimizer level - see
    # IvonDiffusionUnetLowdimPolicy's docstring.
    _target_: diffusion_policy.model.diffusion.conditional_unet1d.ConditionalUnet1D
    input_dim: "${eval: ${task.action_dim} if ${obs_as_global_cond} else ${task.obs_dim} + ${task.action_dim}}"
    global_cond_dim: "${eval: ${task.obs_dim}*${n_obs_steps} if ${obs_as_global_cond} else None}"
    diffusion_step_embed_dim: 256
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: True

  # DDIM instead of DDPM: same underlying training (still predicts noise at
  # a randomly-sampled train-time timestep - IvonDiffusionUnetLowdimPolicy.
  # compute_loss doesn't change at all), but denoising at inference uses far
  # fewer steps (num_inference_steps: 10 below, vs 100 for DDPM) via
  # DDIMScheduler.step's deterministic-subsequence trick. No policy code
  # changes needed for this: conditional_sample() already forwards
  # `**self.kwargs` (built from any extra keys under `policy:` below, i.e.
  # eta/use_clipped_model_output here) straight into `scheduler.step(...)`,
  # exactly like PacDiffusionUnetLowdimPolicy does for its ddim variant.
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    # beta_schedule is important
    # this is the best we found
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon # or sample

  horizon: ${horizon}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 10
  obs_as_global_cond: ${obs_as_global_cond}
  pred_action_steps_only: ${pred_action_steps_only}
  oa_step_convention: True

  # scheduler.step params - forwarded via IvonDiffusionUnetLowdimPolicy's
  # **kwargs/self.kwargs, see the noise_scheduler comment above.
  eta: 0.0
  use_clipped_model_output: True

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256
  num_workers: 1
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 1024
  num_workers: 1
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: ivon.IVON
  lr: 1.0e-3
  beta1: 0.9
  beta2: 0.99999
  hess_init: 1.0
  # mc_samples here is IVON's OWN internal closure-based multi-sampling
  # (unused by this workspace - it manually loops `num_mc_samples` times
  # around sampled_params()/backward() before calling a closure-less
  # optimizer.step() instead, per the documented usage pattern). Leave at
  # 1 to avoid confusing it with the top-level `num_mc_samples`.
  mc_samples: 1
  # ess and weight_decay are deliberately NOT set here - they are derived
  # in TrainIvonDiffusionUnetLowdimWorkspace.__init__ as
  # ess=len(dataset), weight_decay=1/(ess*prior_std^2) - see
  # training.prior_std below, and that file's docstring, and
  # IvonDiffusionUnetLowdimPolicy's.

training:
  # Implicit prior is N(0, prior_std^2 * I) - see
  # TrainIvonDiffusionUnetLowdimWorkspace.__init__. 0.3 matches the IVON
  # paper's own CIFAR-10/100/TinyImageNet setting (delta=2e-4, ess=50000
  # -> prior_std=1/sqrt(ess*delta)=0.316). None of the paper's real
  # experiments use prior_std=1 (a literal N(0,I)): ResNet-50/ImageNet
  # uses ~0.125 (delta=5e-5, ess=1281167); RoBERTa/DeBERTav3 on GLUE use
  # delta=1e-5 with ess=task size, giving prior_std ranging ~0.5 (large
  # tasks like MNLI, ess~393k) to ~5.8 (small tasks like STS-B, ess~7k).
  # prior_std=1 was tried first here and found (from a completed run's
  # saved optimizer state) to let `hess` collapse ~150x below hess_init
  # over 500k steps, driving posterior sigma ~12x higher and coinciding
  # with a severe late-training train_loss divergence - a tighter prior
  # gives weight_decay a real floor against that failure mode.
  prior_std: 0.3
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  desired_ckpt_path: null

  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_updates: 5e5
  use_ema: True
  # training loop control
  # in epochs
  rollout_every: 1e4
  checkpoint_every: 1e4
  val_every: 1e4
  nll_every: 1e4
  reconst_loss_every: 1e6
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint_max_score:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'step={global_step:06d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

checkpoint_last_N:
  topk:
    monitor_key: global_step
    k: 10
    format_str: 'step={global_step:06d}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
