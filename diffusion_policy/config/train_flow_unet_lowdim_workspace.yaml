defaults:
  - _self_
  - task: pusht_lowdim

name: train_flow_unet_lowdim
_target_: diffusion_policy.workspace.train_flow_unet_lowdim_workspace.TrainFlowUnetLowdimWorkspace

obs_dim: ${task.obs_dim}
action_dim: ${task.action_dim}
keypoint_dim: ${task.keypoint_dim}
task_name: ${task.name}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True
pred_action_steps_only: False
num_mc_samples: 1

policy:
  _target_: diffusion_policy.policy.flow_unet_lowdim_policy.FlowUnetLowdimPolicy
  
  model:
    _target_: diffusion_policy.model.diffusion.conditional_unet1d.ConditionalUnet1D
    input_dim: "${eval: ${task.action_dim} if ${obs_as_global_cond} else ${task.obs_dim} + ${task.action_dim}}"
    global_cond_dim: "${eval: ${task.obs_dim}*${n_obs_steps} if ${obs_as_global_cond} else None}"
    diffusion_step_embed_dim: 256
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: True

  FM:
    _target_: diffusion_policy.CFM.conditional_flow_matching.ExactOptimalTransportConditionalFlowMatcher
    sigma: 0.0

  horizon: ${horizon}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  obs_as_global_cond: ${obs_as_global_cond}
  pred_action_steps_only: ${pred_action_steps_only}
  oa_step_convention: True
  prior_std: ${training.prior_std}
  
  # ODE solver parameters
  method: "dopri5"
  step_size: null
  atol: 1e-5
  rtol: 1e-5
  return_intermediates: False
  enable_grad: False

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256
  num_workers: 1
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 1024
  num_workers: 1
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  desired_ckpt_path: null
  
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_updates: 5e5
  use_ema: True
  # training loop control
  # in epochs
  rollout_every: 1e4
  checkpoint_every: 1e4
  val_every: 2e3
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0
  #flow
  prior_std: 1.0
  x1_vf_bs: 0
  skewed_timesteps: False

eval:
  prior_std: ${training.prior_std}
  exact_divergence: True

logging:
  project: diffusion_policy_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint_max_score:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'step={global_step:06d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

checkpoint_last_N:
  topk:
    monitor_key: global_step
    k: 10
    format_str: 'step={global_step:06d}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

checkpoint_nll:
  topk:
    monitor_key: test_nll_bpd
    mode: min
    k: 1
    format_str: 'step={global_step:06d}-nll_bpd={test_nll_bpd:.3f}.ckpt'
  save_last_ckpt: False
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
