defaults:
  - _self_
  - task: pusht_lowdim

name: train_pac_diffusion_unet_lowdim
_target_: diffusion_policy.workspace.train_pac_diffusion_unet_lowdim_workspace.TrainPacDiffusionUnetLowdimWorkspace

obs_dim: ${task.obs_dim}
action_dim: ${task.action_dim}
keypoint_dim: ${task.keypoint_dim}
task_name: ${task.name}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True
pred_action_steps_only: False
num_mc_samples: 10

policy:
  _target_: diffusion_policy.policy.pac_diffusion_unet_lowdim_policy.PacDiffusionUnetLowdimPolicy

  model:
    #_target_: diffusion_policy.model.diffusion.conditional_prob1_unet1d.BayesianConditionalUnet1D          # Full Bayesian NN
    _target_: diffusion_policy.model.diffusion.conditional_prob2_unet1d.BayesianConditionalUnet1D          # Full Bayesian NN except conditioning FiLM layers and time embeding are deterministic
    #_target_: diffusion_policy.model.diffusion.conditional_prob3_unet1d.BayesianConditionalUnet1D          # Probabilistic FiLM conditioning + Probabilistic timestep encoding
    #_target_: diffusion_policy.model.diffusion.conditional_prob4_unet1d.BayesianConditionalUnet1D          # Probabilistic FiLM conditioning + Deterministic timestep encoding
    #_target_: diffusion_policy.model.diffusion.conditional_prob5_unet1d.BayesianConditionalUnet1D          # Determinstic FiLM conditioning  + Probabilistic timestep encoding 
    #_target_: diffusion_policy.model.diffusion.conditional_prob6_unet1d.BayesianConditionalUnet1D          # Probabilistic layer only the last layer of the network
    #_target_: diffusion_policy.model.diffusion.conditional_prob7_unet1d.BayesianConditionalUnet1D          # Last module deterministic
    #_target_: diffusion_policy.model.diffusion.conditional_prob8_unet1d.BayesianConditionalUnet1D          # last layer of last module is determininstic 
    #_target_: diffusion_policy.model.diffusion.conditional_prob9_unet1d.BayesianConditionalUnet1D          # Last module bayesian
    #_target_: diffusion_policy.model.diffusion.conditional_prob10_unet1d.BayesianConditionalUnet1D         # Only Last module bayesian

    input_dim: "${eval: ${task.action_dim} if ${obs_as_global_cond} else ${task.obs_dim} + ${task.action_dim}}"
    global_cond_dim: "${eval: ${task.obs_dim}*${n_obs_steps} if ${obs_as_global_cond} else None}"
    diffusion_step_embed_dim: 256
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: True
    # Bayesian parameters
    rho_post: -3.0
    rho_prior: 0.54
    prior_dist: 'gaussian'
    init_post: 'random'
    init_prior: 'random'
    # Fan-in-scaled alternative to the absolute rho_post/rho_prior above: when
    # set, a layer's initial posterior/prior std is post_sigma_scale/
    # prior_sigma_scale times that layer's own (fan-in-scaled) deterministic
    # weight-init std, instead of one value shared by every layer regardless
    # of width - see bayes_conv1d_components.sigma_to_rho(). null (default)
    # keeps the original absolute-rho behaviour unchanged.
    post_sigma_scale: null
    prior_sigma_scale: null
    # Local reparameterization trick (Kingma, Salimans & Welling, 2015):
    # sample pre-activations directly (mean/var computed in closed form from
    # the input and the weight posterior) instead of sampling a full weight
    # tensor per forward call - mathematically exact for these layers and
    # gives lower-variance gradients. True (default) enables it; False falls
    # back to the original global/Blundell-style weight sampling.
    local_reparam: True
    
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    # beta_schedule is important
    # this is the best we found
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon # or sample

  horizon: ${horizon}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 10
  obs_as_global_cond: ${obs_as_global_cond}
  pred_action_steps_only: ${pred_action_steps_only}
  oa_step_convention: True

  # scheduler.step params
  # predict_epsilon: True
  eta: 0.0
  use_clipped_model_output: True
  
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256
  num_workers: 1
  shuffle: True
  pin_memory: True
  persistent_workers: False
  
val_dataloader:
  batch_size: 1024
  num_workers: 1
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: False
  desired_ckpt_path: null
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_updates: 1e6
  use_ema: True
  # training loop control
  # in epochs
  rollout_every: 1.e3
  checkpoint_every: 2.5e4
  val_every: 2.5e4
  sample_every: 2.5e4
  nll_every: 2.5e4
  reconst_loss_every: 2.5e4
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0
  # Bayesian NN
  stochastic: True
  # Whether to bound loss_emp into [0,1] (via bound_transform below) before it
  # enters the fquad/classic/friendly bound formulas, which are only valid
  # for a risk bounded in [0,1] - see BaseLowdimPacPolicy._bound_empirical_risk.
  # Optional: False uses the raw, unbounded loss_emp.
  bounded: False
  # "clamp" (default): min(loss_emp, 1) - exactly bounded, but zero gradient
  #   once loss_emp > 1 (safe once you've confirmed, as here, that it drops
  #   below 1 early in training).
  # "exp"/"tanh": smooth saturating alternatives (1-exp(-x) / tanh(x)) that
  #   are also exactly bounded in [0,1) but never have zero gradient, so they
  #   don't stall training even if loss_emp is briefly > 1. None of these
  #   rescale loss_emp - they operate on the raw value.
  bound_transform: "clamp"
  delta: 0.025
  kl_penalty: 1.0e-4
  pac_objective: "friendly"  # "fquad" or "calssic", "bbb"
  # If True: train with a data-dependent prior. task.dataset.train_episodes_for_posterior
  # demos go to posterior/bound training, the rest to prior training. If
  # prior_checkpoint_path already exists it's loaded as-is; otherwise the prior is
  # trained here (Bayesian: stochastic weight sampling, no PAC-Bayes bound - see
  # TrainPacDiffusionUnetLowdimWorkspace._train_prior) for prior_num_updates steps
  # and saved there, so a later run pointed at the same path skips retraining.
  # Either way, the posterior is then initialized from the resulting prior and
  # trained with the full PAC-Bayes bound - and n_bound (used by compute_bound)
  # is derived from the disjoint posterior/bound split's size, not the full
  # dataset's, so the bound stays valid (see _setup_train_dataset()).
  # If False: prior/posterior stay exactly as cfg.policy constructs them (init_prior/
  # init_post/rho_prior/rho_post), and training runs on the full dataset.
  data_dependent_prior: False
  prior_num_updates: 1e3
  # {task_name}/{n_prior_demos} are plain Python str.format() placeholders (NOT
  # OmegaConf ${...} interpolation - n_prior_demos isn't known until the dataset
  # is split at runtime). Resolved in TrainPacDiffusionUnetLowdimWorkspace.
  # _resolve_prior_checkpoint_path() once the actual prior split size is known,
  # e.g. -> "pac_diffusion_prior_pusht_lowdim_demos=102.ckpt".
  prior_checkpoint_path: "data/outputs/prior_checkpoints/pac_diffusion_prior_{task_name}_demos={n_prior_demos}.ckpt"

eval:
  stochastic: True
  delta: 0.05
  mc_sampling: 1000
  
logging:
  project: diffusion_policy_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint_max_score:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'step={global_step:06d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

checkpoint_last_N:
  topk:
    monitor_key: global_step
    k: 10
    format_str: 'step={global_step:06d}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
